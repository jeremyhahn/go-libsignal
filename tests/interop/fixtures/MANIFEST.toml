# Conformance-fixture manifest.
#
# Each entry pins a fixture that is a verbatim copy of a file in the upstream
# Rust libsignal source tree at the commit recorded in /RUST_REV. CI regenerates
# the manifest from the upstream tree and fails on any drift; manual edits to
# this file or to the fixture bytes are not allowed except as part of a
# RUST_REV bump.
#
# Schema: each fixture is one [[fixture]] table with these fields:
#   path      relative path under tests/interop/fixtures/
#   upstream  relative path under <RUST_REV>/rust/
#   sha256    sha256 of the upstream bytes
#   size      size in bytes
#   purpose   short human note on what the fixture proves

