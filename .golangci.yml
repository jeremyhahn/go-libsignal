# golangci-lint v2 configuration for go-libsignal.
#
# conventions/devops.md §8 requires staticcheck, errcheck, unused, ineffassign,
# misspell and gocritic to be enabled here — installing the umbrella with the
# security linters off does not satisfy that section.
#
# staticcheck's check list mirrors staticcheck.conf so `make lint` and
# `make staticcheck` cannot disagree. Keep the two in sync.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # misspell carries no locale on purpose. The tree is written in British
    # English ("behaviour", "serialised", "amortised"); pinning locale: US
    # would turn 42 deliberate spellings into lint failures. Without a locale
    # misspell still catches genuine typos, which is what §8 wants from it.
    - misspell
    - gocritic
    - bodyclose

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false

    staticcheck:
      # Mirrors staticcheck.conf. ST1003 (initialisms) and ST1016 (receiver
      # name consistency) are deferred to the v1.0 rename pass; both are
      # API-breaking to fix and are documented in staticcheck.conf,
      # CONTRIBUTING.md and CHANGELOG.md.
      checks:
        - "all"
        - "-ST1003"
        - "-ST1016"

    gocritic:
      # Default check set only. The style/opinionated/experimental tags are
      # taste, not defects, and turning them on here buys noise rather than
      # signal.
      disabled-checks:
        - ifElseChain
        # Single-capital locals (A, E, I, M, R, V, PK) are the notation the
        # X3DH / PQXDH / Double Ratchet specs and the zkgroup papers use. The
        # code is far easier to check against the spec with the spec's names.
        - captLocal

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - staticcheck
          - unparam
      # tests/ is the conformance and interop harness; examples/ and bench/
      # are demo and measurement code. None of them ship to a consumer.
      - path: ^(tests|examples|bench)/
        linters:
          - errcheck
          - gocritic
          - staticcheck
          - unparam

# No formatters are enabled here: `make fmtcheck` is the gofmt gate and scopes
# itself to pkg/ tests/ examples/ and the root, which is the tree the project
# formats.

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
