# golangci-lint v2 configuration; the staticcheck check list mirrors staticcheck.conf.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # No misspell locale: the tree uses British spelling on purpose.
    - misspell
    - gocritic
    - bodyclose

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false

    staticcheck:
      # Mirrors staticcheck.conf; ST1003 and ST1016 are API-breaking and deferred to v1.0.
      checks:
        - "all"
        - "-ST1003"
        - "-ST1016"

    gocritic:
      # Default check set only. The style/opinionated/experimental tags are
      # taste, not defects, and turning them on here buys noise rather than
      # signal.
      disabled-checks:
        - ifElseChain
        # Single-capital locals (A, E, I, M, R, V, PK) are the notation the
        # X3DH / PQXDH / Double Ratchet specs and the zkgroup papers use. The
        # code is far easier to check against the spec with the spec's names.
        - captLocal

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - staticcheck
          - unparam
      # tests/ is the conformance and interop harness; examples/ and bench/
      # are demo and measurement code. None of them ship to a consumer.
      - path: ^(tests|examples|bench)/
        linters:
          - errcheck
          - gocritic
          - staticcheck
          - unparam

# No formatters are enabled here: `make fmtcheck` is the gofmt gate and scopes
# itself to pkg/ tests/ examples/ and the root, which is the tree the project
# formats.

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
