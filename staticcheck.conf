# staticcheck configuration for go-libsignal.
#
# All checks enabled by default. Two name-related checks are explicitly excluded
# for the v0.x line and deferred to v1.0 prep:
#
#   ST1003 — Go initialism conventions (e.g., `ServiceId` should be `ServiceID`,
#            `IpType` should be `IPType`, package `incremental_mlkem768` should
#            be `incrementalmlkem768`). Fixing these requires renaming dozens of
#            exported types/methods, which is an API-breaking change. The
#            renames are scheduled for v1.0 along with the broader API freeze;
#            see CHANGELOG.md and the v1.0 stability roadmap. Re-enabling this
#            check before v1.0 must coincide with the renames.
#
#   ST1016 — receiver names must match across methods on the same type. Several
#            packages mix single-letter and short-name receivers (e.g., "p"
#            vs "pub"). Normalising these is mechanical but spans many files;
#            scheduled with the v1.0 rename pass.
#
# Both findings were surfaced by `make ci` and triaged as deliberate deferrals,
# not regressions. CONTRIBUTING.md and CHANGELOG.md document the rationale.
checks = ["all", "-ST1003", "-ST1016"]
