name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  GOWORK: off

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@d60b41a563a30eb0b7f6a852f3d5e67ebb8f8df8  # v5.5.0
        with:
          go-version: '1.26.5'
          cache: true

      - name: Run CI
        run: make ci

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@d60b41a563a30eb0b7f6a852f3d5e67ebb8f8df8  # v5.5.0
        with:
          go-version: '1.26.5'
          cache: true

      - name: Install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest

      - name: Generate SBOM (JSON)
        run: cyclonedx-gomod mod -json -licenses -output sbom.cdx.json

      - name: Generate SBOM (XML)
        run: cyclonedx-gomod mod -output sbom.cdx.xml

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.cdx.xml
          retention-days: 90

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: sbom
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download SBOM artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e  # v4.2.1
        with:
          name: sbom
          path: dist/

      - name: Compute checksums
        run: sha256sum dist/sbom.cdx.json dist/sbom.cdx.xml > dist/checksums.txt

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine if prerelease
        id: prerelease
        run: |
          tag="${{ steps.tag.outputs.name }}"
          if echo "$tag" | grep -qE -- '-(rc|alpha|beta)\.' ; then
            echo "flag=true" >> "$GITHUB_OUTPUT"
          else
            echo "flag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate release notes
        id: notes
        run: |
          tag="${{ steps.tag.outputs.name }}"
          notes_file="RELEASE_NOTES_${tag}.md"
          if [ ! -f "$notes_file" ]; then
            notes_file="RELEASE_NOTES_v0.1.0.md"
          fi
          if [ ! -f "$notes_file" ]; then
            echo "## Release ${tag}" > release_notes.md
            notes_file="release_notes.md"
          fi
          echo "file=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631  # v2.2.2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: ${{ steps.notes.outputs.file }}
          prerelease: ${{ steps.prerelease.outputs.flag }}
          files: |
            dist/sbom.cdx.json
            dist/sbom.cdx.xml
            dist/checksums.txt
