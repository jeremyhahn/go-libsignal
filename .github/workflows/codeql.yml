name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Sundays at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

permissions:
  security-events: write
  actions: read
  contents: read

env:
  GOWORK: off

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    # CodeQL is a GitHub service: the init/analyze actions upload to the code
    # scanning API, which Gitea does not serve. A job-level guard is evaluated
    # after a runner picks the job up, so the job is skipped cleanly on Gitea
    # rather than failing (devops.md §1). It is deliberately not in any gate's
    # needs for that reason.
    if: github.server_url == 'https://github.com'

    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      # Tags, not commit SHAs. act_runner cannot resolve a bare SHA that is not
      # a branch or tag tip ("reference not found"), which is what broke every
      # SHA-pinned workflow in this repo; devops.md §9 wants latest majors here
      # regardless.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          cache: false

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-codeql-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-codeql-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Build
        env:
          GOWORK: off
        run: GOWORK=off go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
