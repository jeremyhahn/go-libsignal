name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Sundays at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

permissions:
  security-events: write
  actions: read
  contents: read

env:
  GOWORK: off

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    # CodeQL uploads to GitHub code scanning; the job-level guard skips it on other forges, so no gate needs it.
    if: github.server_url == 'https://github.com'

    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      # Tags, not commit SHAs: act_runner cannot resolve a bare SHA that is not a branch or tag tip.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-codeql-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-codeql-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Build
        env:
          GOWORK: off
        run: GOWORK=off go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
