name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Weekly on Monday at 03:00 UTC to catch upstream fixture drift.
    - cron: '0 3 * * 1'

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Vet
        run: make vet

      - name: Conformance fixture manifest
        # Verify every fixture under tests/interop/fixtures/ matches its
        # sha256 in MANIFEST.toml. The upstream-bytes diff (LIBSIGNAL_UPSTREAM)
        # runs in the dedicated conformance job below, where the upstream
        # tree is fetched.
        run: make interop-fixtures-check

      - name: Test
        run: make test 2>&1 | tee test.log

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

  conformance-fixtures:
    name: Conformance Fixtures (upstream diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: go-libsignal

      - name: Read pinned RUST_REV
        id: rust_rev
        run: |
          rev=$(grep -vE '^\s*(#|$)' go-libsignal/RUST_REV | head -n1)
          echo "rev=${rev}" >>"$GITHUB_OUTPUT"

      - name: Fetch upstream Rust libsignal at pinned commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/signalapp/libsignal.git upstream
          git -C upstream checkout ${{ steps.rust_rev.outputs.rev }}

      - name: Diff fixtures against upstream tree
        run: |
          LIBSIGNAL_UPSTREAM="$GITHUB_WORKSPACE/upstream" \
            go-libsignal/tests/interop/scripts/check_fixtures.sh

  interop-live:
    name: Live Interop (Rust↔Go)
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/interop/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tests/interop/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Build Rust interop binaries
        run: make interop-live-build

      - name: Run live interop test suite
        run: make interop-live

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Verify module integrity
        run: go mod verify

      - name: Install security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run gosec
        run: make gosec 2>&1 | tee gosec.log

      - name: Run govulncheck
        run: make govulncheck 2>&1 | tee govulncheck.log

      - name: Run staticcheck
        run: make staticcheck 2>&1 | tee staticcheck.log

      - name: Upload security logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-logs
          path: |
            gosec.log
            govulncheck.log
            staticcheck.log

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Two paths for one gate (devops.md §8). trivy-action's setup step cannot
      # authenticate to github.com from a Gitea runner and upload-sarif has no
      # GHES-compatible endpoint there, so the action path is guarded on the
      # server URL and Gitea gates with the trivy CLI below. Both run the same
      # fs scan at the same severity; only the SARIF upload is GitHub-only.
      #
      # tests/, examples/ and bench/ are skipped: none of them ship to a
      # consumer of the library, and tests/interop/rust carries the upstream
      # Rust reference crate purely to diff wire bytes against.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: tests,examples,bench
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: tests,examples,bench
          trivyignores: .trivyignore

      - name: Install Trivy CLI (Gitea)
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --skip-dirs tests,examples,bench .

  # There is deliberately no trivy-image job yet. The only container this repo
  # builds is the Rust<->Go interop harness, and tests/interop/Dockerfile does
  # not build today: the crate's Cargo.toml has path dependencies on a sibling
  # upstream libsignal checkout the Dockerfile never provides. `make
  # trivy-image` carries the ready-to-use scan and the full explanation; add
  # the CI job when the Dockerfile is repaired.

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Integration Test
        run: make integration-test 2>&1 | tee integration-test.log

      - name: Upload integration test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-log
          path: integration-test.log

  examples-build:
    name: Examples Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Build examples
        # Ensures example code compiles against the current API so examples
        # cannot silently drift from exported symbols.
        run: make examples-build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Coverage
        run: make coverage 2>&1 | tee coverage.log

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/coverage.out
            coverage/coverage.html
            coverage.log
