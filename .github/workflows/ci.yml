name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Weekly on Monday at 03:00 UTC to catch upstream fixture drift.
    - cron: '0 3 * * 1'

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Vet
        run: make vet

      - name: Conformance fixture manifest
        # Verify every fixture under tests/interop/fixtures/ matches its
        # sha256 in MANIFEST.toml. The upstream-bytes diff (LIBSIGNAL_UPSTREAM)
        # runs in the dedicated conformance job below, where the upstream
        # tree is fetched.
        run: make interop-fixtures-check

      - name: Test
        run: make test 2>&1 | tee test.log

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

  conformance-fixtures:
    name: Conformance Fixtures (upstream diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: go-libsignal

      - name: Read pinned RUST_REV
        id: rust_rev
        run: |
          rev=$(grep -vE '^\s*(#|$)' go-libsignal/RUST_REV | head -n1)
          echo "rev=${rev}" >>"$GITHUB_OUTPUT"

      - name: Fetch upstream Rust libsignal at pinned commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/signalapp/libsignal.git upstream
          git -C upstream checkout ${{ steps.rust_rev.outputs.rev }}

      - name: Diff fixtures against upstream tree
        run: |
          LIBSIGNAL_UPSTREAM="$GITHUB_WORKSPACE/upstream" \
            go-libsignal/tests/interop/scripts/check_fixtures.sh

  interop-live:
    name: Live Interop (Rust↔Go)
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/interop/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tests/interop/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Build Rust interop binaries
        run: make interop-live-build

      - name: Run live interop test suite
        run: make interop-live

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Install security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run gosec
        run: make gosec 2>&1 | tee gosec.log

      - name: Run govulncheck
        run: make govulncheck 2>&1 | tee govulncheck.log

      - name: Run staticcheck
        run: make staticcheck 2>&1 | tee staticcheck.log

      - name: Upload security logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-logs
          path: |
            gosec.log
            govulncheck.log
            staticcheck.log

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Integration Test
        run: make integration-test 2>&1 | tee integration-test.log

      - name: Upload integration test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-log
          path: integration-test.log

  examples-build:
    name: Examples Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Build examples
        # Ensures example code compiles against the current API so examples
        # cannot silently drift from exported symbols.
        run: make examples-build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Coverage
        run: make coverage 2>&1 | tee coverage.log

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/coverage.out
            coverage/coverage.html
            coverage.log
