# ci-template: v1.15 (customized)
# Reconciled against software/templates/github-actions/ci.yml in the
# automatethethings repo (devops.md §1/§8/§9). Divergence outside the
# repo-specific blocks below is a defect.
#
# Every step that pipes a `make` target into `tee` sets `shell: bash` and
# `set -o pipefail`. The default step shell is `bash -e` WITHOUT pipefail, so a
# pipeline exits with tee's status and the step passes however the target
# failed. That silently made the whole Security job vacuous.
#
# v1.15 (#51, automatethethings#209): every job starts at once (template
# v1.14: no staged `needs`; CI Gate needs them all and fails closed), and
# push/pull_request run on main only. Go is 1.27.1, matching go.mod (#53).

name: CI

on:
  push:
    # main is the only trunk (trunk-based; the server has no master or
    # develop). automerge.yml's merge trains are PRs from merge-train/* and
    # get CI from pull_request (template v1.15).
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel a CI run the moment a newer push makes it irrelevant. Portfolio-wide,
# 73% of CI runs were superseded and still ran to completion; the queue they
# built was the biggest constraint on landing work.
#
# CORRECTION to commit b9605e1 ("ci: drop concurrency from workflows"), whose
# message reads as a blanket finding that Gitea 1.27.1 cancels any job carrying
# a concurrency group "even when that group is unoccupied". It does not, and
# that commit was never about this file: it touched only task-worker.yml (since
# decommissioned, sdlc.md §8), at JOB level, with cancel-in-progress: FALSE and
# a group of `task-worker-${{ github.repository }}` — a key with no ref
# component, so every task worker in the repo shared ONE group. The group was
# saturated by sibling workers, not unoccupied, and Gitea cannot QUEUE: a job
# that cannot enter an occupied group is cancelled outright. The observation was
# real; the conclusion drawn from it was not, and it says nothing about a
# ref-keyed group with cancel-in-progress: true.
#
# Measured on live Gitea 1.27.1: with the block below, the OLDER run is
# cancelled and the NEWEST survives.
#
# Three properties this block depends on, each of them load-bearing:
#
#  - WORKFLOW level, not job level. A per-job group is what produced the
#    misreading above.
#  - The group leads with `github.workflow`, so the `CI` group structurally
#    cannot reach the separate `Code Review` workflow that also gates merges
#    here. A cancelled run does write `failure` to its context, but the
#    required contexts are (pull_request)-suffixed and a cancellation only ever
#    lands on a SUPERSEDED sha.
#  - The literal `true`. cancel-in-progress does NOT evaluate expressions on
#    1.27.1 — any non-empty value is truthy — so an expression here would read
#    as an unconditional true while looking conditional.
#
# Adopting this is also why `POST /actions/runs/<id>/cancel` being absent from
# this Gitea's REST surface (verified against the live swagger.v1.json) is not
# a gap to work around: `concurrency:` is the only mechanism there is.
#
# Expect exactly one boundary case: Gitea groups a run by the workflow file OF
# THAT RUN, so a run started before this landed belongs to no group and cannot
# be superseded by the first push after it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  fips:
    name: FIPS
    runs-on: ubuntu-latest
    # No `needs` (template v1.14): every job starts at once; CI Gate fails
    # closed on any of them.
    timeout-minutes: 30
    env:
      GOFIPS140: latest
      GODEBUG: fips140=only
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      # This job runs the same memguard-heavy tests as `test` below, so it
      # needs the same RLIMIT_MEMLOCK. Report it here too: exhaustion surfaces
      # as "memcall could not acquire lock", which is easy to misread as a
      # FIPS finding. See the note on the `test` job for the measurements.
      - name: Report locked-memory limit
        run: |
          echo "RLIMIT_MEMLOCK soft: $(ulimit -S -l) KB, hard: $(ulimit -H -l) KB"

      # Repo-specific: the two steps below run `make fips-build` / `make
      # fips-test` rather than the template's bare `go build` / `go test`, so a
      # developer running `make fips` locally gets the identical invocation.
      # The make targets set GOFIPS140/GODEBUG to the same values as the job
      # env above.
      #
      # fips-build is deliberately untagged: the library must compile exactly
      # as it ships. fips-test carries the fips140only build tag, which drops
      # the tests listed in docs/FIPS.md -- primitives the Signal Protocol or
      # an external standard mandates and FIPS 140-3 does not approve, each
      # with its citation. Everything else is gated, so a NEW non-approved
      # call anywhere outside that register fails this job.
      - name: Build all packages (FIPS mode)
        run: make fips-build

      - name: Unit tests (FIPS mode)
        run: make fips-test

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true

      - name: Conformance fixture manifest
        # Verify every fixture under tests/interop/fixtures/ matches its
        # sha256 in MANIFEST.toml. This needs no network and no upstream tree,
        # so fixture-byte drift is caught on every push. The verbatim
        # upstream-tree diff (LIBSIGNAL_UPSTREAM) needs a full libsignal
        # checkout and lives in interop.yml -- see the note above ci-gate.
        run: make interop-fixtures-check

      # memguard mlock()s every secret, and the suite holds thousands at once
      # (TestGroupCipherDecryptTooFarInFuture drives a chain 25,002 messages
      # forward). That needs RLIMIT_MEMLOCK >= 2 GiB; see the locked-memory
      # section of CONTRIBUTING.md for the measurements. Docker defaults it to
      # 8 MiB soft AND hard, and the hard limit cannot be raised from inside the
      # container without CAP_SYS_RESOURCE — so the runner has to grant it. The
      # company's Gitea runners pass --ulimit memlock=4294967296 (4 GiB, granted
      # 2026-08-14). Report the limit before running, so exhaustion reads as a
      # provisioning problem rather than a mysterious allocation failure deep in
      # a test — that is exactly how it was diagnosed.
      - name: Report locked-memory limit
        run: |
          echo "RLIMIT_MEMLOCK soft: $(ulimit -S -l) KB, hard: $(ulimit -H -l) KB"

      - name: Test
        shell: bash
        run: set -o pipefail; make test 2>&1 | tee test.log

      # upload-artifact v4+ refuses to run against any server that is not
      # github.com -- it detects one and reports "not currently supported on
      # GHES", and Gitea presents as such (devops.md §1). Every such step in
      # this file is guarded; the work it captures has already run.
      - name: Upload test log
        if: failure() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

  # The four TestProptest_* cases were 79% of pkg/session's runtime and left
  # the 900s per-binary cap only 4.4x above a host measured varying up to 8.7x.
  # On 2026-08-21 that margin ran out and took the whole Test job with it, on a
  # timeout none of the other 225 tests in the package caused (#30).
  #
  # Split out rather than raising GOTEST_TIMEOUT, which governs every suite
  # including the FIPS gate. Still runs on every PR -- the point is isolation
  # and its own budget, not running them less often. `make test-proptest` fails
  # if fewer tests run than the source declares, so this job cannot pass by
  # testing nothing.
  proptest:
    name: Property Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true

      # Same reasoning as the Test job: these drive full sessions and hold many
      # guarded buffers, so report the limit before running.
      - name: Report locked-memory limit
        run: |
          echo "RLIMIT_MEMLOCK soft: $(ulimit -S -l) KB, hard: $(ulimit -H -l) KB"

      # The target is only worth running if it still carries its own budget and
      # still fails closed: this proves both before we trust its verdict below.
      - name: Property-test target self-test
        run: make test-proptest-selftest

      - name: Property tests
        shell: bash
        run: set -o pipefail; make test-proptest 2>&1 | tee proptest.log

      - name: Upload property test log
        if: failure() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: proptest-log
          path: proptest.log

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true

      - name: Build all packages
        run: go build ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true

      - name: Verify module integrity
        run: go mod verify

      - name: Install security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run gosec
        shell: bash
        run: set -o pipefail; make gosec 2>&1 | tee gosec.log

      - name: Run govulncheck
        shell: bash
        run: set -o pipefail; make govulncheck 2>&1 | tee govulncheck.log

      # staticcheck-latest, NOT staticcheck. This job's purpose is discovering
      # SA findings a newer analyser reports; `make staticcheck` is pinned for
      # local reproducibility and would silently run the pin here, reporting
      # success on the very version this gate exists to improve on.
      - name: Run staticcheck (latest, discovery)
        shell: bash
        run: set -o pipefail; make staticcheck-latest 2>&1 | tee staticcheck.log

      - name: Upload security logs
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: security-logs
          path: |
            gosec.log
            govulncheck.log
            staticcheck.log

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      # Two paths for one gate (devops.md §8). trivy-action's setup step cannot
      # authenticate to github.com from a Gitea runner and upload-sarif has no
      # GHES-compatible endpoint there, so the action path is guarded on the
      # server URL and Gitea gates with the trivy CLI below. Both run the same
      # fs scan at the same severity; only the SARIF upload is GitHub-only.
      #
      # tests/, examples/ and bench/ are skipped: none of them ship to a
      # consumer of the library, and tests/interop/rust carries the upstream
      # Rust reference crate purely to diff wire bytes against.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: tests,examples,bench
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: tests,examples,bench
          trivyignores: .trivyignore

      - name: Install Trivy CLI (Gitea)
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --skip-dirs tests,examples,bench .

  # There is deliberately no trivy-image job yet. The only container this repo
  # builds is the Rust<->Go interop harness, and tests/interop/Dockerfile does
  # not build today: the crate's Cargo.toml has path dependencies on a sibling
  # upstream libsignal checkout the Dockerfile never provides. `make
  # trivy-image` carries the ready-to-use scan and the full explanation; add
  # the CI job when the Dockerfile is repaired.

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true

      # gofmt and vet are part of the template's Lint job and of `make ci`;
      # neither had a CI gate here before.
      - name: Check formatting
        run: make fmtcheck

      - name: Vet
        run: make vet

      # Both self-tests assert Makefile contracts and need no analyser, so they
      # run here rather than in Security Scan. Without a CI gate a self-test only
      # protects the developer who remembers to run it.
      - name: Tool-pin and lint-retry self-tests
        run: make staticcheck-selftest lint-pin-selftest lint-retry-selftest

      # Latest action major: devops.md §9. The linter itself is pinned.
      #
      # PINNED to the upstream latest (owner ruling 2026-10-07: never pin below
      # latest), in step with the shared CI runner image and the Makefile.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    # No `needs` (template v1.14): starts with the test job, not after it.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true

      - name: Integration Test
        shell: bash
        run: set -o pipefail; make integration-test 2>&1 | tee integration-test.log

      - name: Upload integration test log
        if: failure() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-log
          path: integration-test.log

  examples-build:
    name: Examples Build
    runs-on: ubuntu-latest
    # No `needs` (template v1.14): starts with the test job, not after it.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true

      - name: Build examples
        # Ensures example code compiles against the current API so examples
        # cannot silently drift from exported symbols.
        run: make examples-build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # No `needs` (template v1.14): starts with the test job, not after it.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true

      # The gate is only worth running if it still fails closed: this proves it
      # rejects an unmeasurable profile before we trust its verdict below.
      - name: Coverage gate self-test
        run: make coverage-gate-selftest

      # The threshold gate and the loop that feeds it are separate holes. The
      # gate above reads the aggregate; this proves the loop that BUILDS the
      # aggregate stops when a package fails, instead of leaving it out and
      # handing the gate a well-formed profile measured over a broken tree.
      - name: Coverage loop self-test
        run: make coverage-loop-selftest

      - name: Coverage
        shell: bash
        run: set -o pipefail; make coverage 2>&1 | tee coverage.log

      - name: Upload coverage
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/coverage.out
            coverage/coverage.html
            coverage.log

  # The two jobs that need a full upstream Rust libsignal checkout -- the
  # verbatim fixture diff and the live Rust<->Go interop suite -- live in
  # interop.yml, on a schedule with a paths filter, per devops.md §5. Both
  # compile upstream libsignal (plus zkgroup, SPQR and Signal's curve25519-dalek
  # fork) from source, which is tens of minutes on a serial Gitea runner, and
  # both test a tree pinned immutably by /RUST_REV -- so re-running them on a
  # push that touched neither the pin nor the harness tests nothing new.
  # interop.yml's paths filter fires on exactly the changes that can break them.
  # The no-network half of the fixture gate (`make interop-fixtures-check`)
  # stays in the `test` job above and runs on every push.

  # The single required check (devops.md §1). Every job above appears in BOTH
  # the needs list and the results check -- a gate that can pass vacuously is
  # worse than no gate. join(needs.*.result) is deliberately not used: it
  # evaluates empty on Gitea and reports success while jobs fail.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [test, proptest, build, security, trivy, lint, integration-test, examples-build, coverage, fips]
    steps:
      - name: Fail closed on any non-success
        run: |
          check() { case "$2" in success) echo "OK   $1";; *) echo "FAIL $1 ($2)"; BAD=1;; esac; }
          BAD=0
          check test                  "${{ needs.test.result }}"
          check proptest              "${{ needs.proptest.result }}"
          check build                 "${{ needs.build.result }}"
          check fips        "${{ needs.fips.result }}"
          check security              "${{ needs.security.result }}"
          check trivy                 "${{ needs.trivy.result }}"
          check lint                  "${{ needs.lint.result }}"
          check integration-test      "${{ needs.integration-test.result }}"
          check examples-build        "${{ needs.examples-build.result }}"
          check coverage              "${{ needs.coverage.result }}"
          exit $BAD
