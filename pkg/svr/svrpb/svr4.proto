syntax = "proto3";

package svrb.client;
option go_package = "github.com/jeremyhahn/go-libsignal/pkg/svr/svrpb";

// Client protocol for SVR4.

message Request4 {
  oneof inner {
    Create create = 1;
    Restore1 restore1 = 2;
    Restore2 restore2 = 3;
    Remove remove = 4;
    Query query = 5;
  }

  message Create {
    uint32 max_tries = 1;
    bytes oprf_secretshare = 2;
    bytes auth_commitment = 3;
    bytes encryption_secretshare = 4;
    bytes zero_secretshare = 5;
    fixed32 version = 6;
  }
  message Restore1 {
    bytes blinded = 1;
  }
  message Restore2 {
    bytes auth_point = 1;
    bytes auth_scalar = 2;
    fixed32 version = 3;
  }
  message Remove {
  }
  message Query {
  }
}

message Response4 {
  oneof inner {
    Create create = 1;
    Restore1 restore1 = 2;
    Restore2 restore2 = 3;
    Remove remove = 4;
    Query query = 5;
  }

  enum Status {
    UNSET = 0;
    OK = 1;
    INVALID_REQUEST = 2;
    MISSING = 3;
    ERROR = 4;
    RESTORE1_MISSING = 5;
    VERSION_MISMATCH = 6;
    NOT_ROTATING = 7;
    ALREADY_ROTATING = 8;
    MERKLE_FAILURE = 9;
    DUPLICATE_VERSION = 10;
  }

  message Create {
    Status status = 1;
    uint32 tries_remaining = 2;
  }

  message Restore1 {
    Status status = 1;
    message Auth {
      bytes element = 1;
      fixed32 version = 2;
    }
    repeated Auth auth = 2;
    uint32 tries_remaining = 3;
  }

  message Restore2 {
    Status status = 1;
    bytes encryption_secretshare = 2;
  }

  message Remove {
  }

  message Query {
    Status status = 1;
    uint32 tries_remaining = 2;
    fixed32 version = 3;
    fixed32 new_version = 4;
  }
}
