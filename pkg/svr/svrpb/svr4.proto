syntax = "proto3";

package svrb.client;
option go_package = "github.com/jeremyhahn/go-libsignal/pkg/svr/svrpb";

// Client protocol for SVR4.

message Request4 {
  oneof inner {
    Create create = 1;
    Restore1 restore1 = 2;
    Restore2 restore2 = 3;
    Remove remove = 4;
    Query query = 5;
    RotateStart rotate_start = 6;
    RotateCommit rotate_commit = 7;
    RotateRollback rotate_rollback = 8;
  }

  message Create {
    uint32 max_tries = 1;
    bytes oprf_secretshare = 2;
    bytes auth_commitment = 3;
    bytes encryption_secretshare = 4;
    bytes zero_secretshare = 5;
    fixed32 version = 6;
  }
  message Restore1 {
    bytes blinded = 1;
  }
  message Restore2 {
    bytes auth_point = 1;
    bytes auth_scalar = 2;
    fixed32 version = 3;
  }
  message Remove {
  }
  message Query {
  }
  // RotateStart initiates an OPRF-key rotation. The server begins a
  // rotation and applies the delta secret-shares.
  //
  // Rust libsignal ref: rust/svrb/src/svrb.proto Request4.RotateStart
  message RotateStart {
    fixed32 version = 1;
    bytes oprf_secretshare_delta = 2;
    bytes encryption_secretshare_delta = 3;
  }
  // RotateCommit commits a previously started rotation, making the new
  // OPRF key permanent.
  //
  // Rust libsignal ref: rust/svrb/src/svrb.proto Request4.RotateCommit
  message RotateCommit {
    fixed32 version = 1;
  }
  // RotateRollback aborts a previously started rotation and reverts to
  // the previous OPRF key.
  //
  // Rust libsignal ref: rust/svrb/src/svrb.proto Request4.RotateRollback
  message RotateRollback {
    fixed32 version = 1;
  }
}

message Response4 {
  oneof inner {
    Create create = 1;
    Restore1 restore1 = 2;
    Restore2 restore2 = 3;
    Remove remove = 4;
    Query query = 5;
    RotateStart rotate_start = 6;
    RotateCommit rotate_commit = 7;
    RotateRollback rotate_rollback = 8;
  }

  enum Status {
    UNSET = 0;
    OK = 1;
    INVALID_REQUEST = 2;
    MISSING = 3;
    ERROR = 4;
    RESTORE1_MISSING = 5;
    VERSION_MISMATCH = 6;
    NOT_ROTATING = 7;
    ALREADY_ROTATING = 8;
    MERKLE_FAILURE = 9;
    DUPLICATE_VERSION = 10;
  }

  message Create {
    Status status = 1;
    uint32 tries_remaining = 2;
  }

  message Restore1 {
    Status status = 1;
    message Auth {
      bytes element = 1;
      fixed32 version = 2;
    }
    repeated Auth auth = 2;
    uint32 tries_remaining = 3;
  }

  message Restore2 {
    Status status = 1;
    bytes encryption_secretshare = 2;
  }

  message Remove {
  }

  message Query {
    Status status = 1;
    uint32 tries_remaining = 2;
    fixed32 version = 3;
    fixed32 new_version = 4;
  }

  // RotateStart response. Returns the status of the rotation initiation.
  //
  // Rust libsignal ref: rust/svrb/src/svrb.proto Response4.RotateStart
  message RotateStart {
    Status status = 1;
  }

  // RotateCommit response. Returns the status of the rotation commit.
  //
  // Rust libsignal ref: rust/svrb/src/svrb.proto Response4.RotateCommit
  message RotateCommit {
    Status status = 1;
  }

  // RotateRollback response. Returns the status of the rotation rollback.
  //
  // Rust libsignal ref: rust/svrb/src/svrb.proto Response4.RotateRollback
  message RotateRollback {
    Status status = 1;
  }
}
